<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Static defaults for crawlers that don't execute JS (most social-share
      bots: Telegram, WhatsApp, Facebook, LinkedIn, Slack). Per-page titles
      and descriptions are set at runtime via src/hooks/usePageMeta.ts for
      the browser tab and for Google's JS-rendering crawler, but a bot that
      only fetches raw HTML will always see exactly what's below — so these
      have to be good, generic defaults on their own.
    -->
    <title>Global Tech Tour · by Aura Robotics</title>
    <meta
      name="description"
      content="Global Tech Tour — business expeditions to China's industry leaders. Private visits to production sites and headquarters, 350+ companies across 17 sectors."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://globaltechtour.ru/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Global Tech Tour" />
    <meta property="og:title" content="Global Tech Tour · by Aura Robotics" />
    <meta
      property="og:description"
      content="Business expeditions to China's industry leaders. Private visits to production sites and headquarters, 350+ companies across 17 sectors."
    />
    <meta property="og:url" content="https://globaltechtour.ru/" />
    <meta property="og:image" content="https://globaltechtour.ru/og-image-en.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ru_RU" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Global Tech Tour · by Aura Robotics" />
    <meta
      name="twitter:description"
      content="Business expeditions to China's industry leaders. Private visits to production sites and headquarters, 350+ companies across 17 sectors."
    />
    <meta name="twitter:image" content="https://globaltechtour.ru/og-image-en.png" />

    <!-- Organization structured data — static, so it's crawlable without JS -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TravelAgency",
        "name": "Global Tech Tour",
        "alternateName": ["上海拼那克了科技有限责任公司", "Shanghai Pinnacle Technology Co., Ltd."],
        "url": "https://globaltechtour.ru/",
        "logo": "https://globaltechtour.ru/icon-512.png",
        "image": "https://globaltechtour.ru/og-image-en.png",
        "description": "Business expeditions to China's industry leaders — private visits to production sites and headquarters, 350+ companies across 17 sectors.",
        "email": "inquairy@aura-robotics.ru",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Gaoshang Lingyu Complex, Tower T3, Office 1235, Putuo District",
          "addressLocality": "Shanghai",
          "addressCountry": "CN"
        },
        "areaServed": "CN",
        "sameAs": ["https://t.me/ostapdotcenko"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
