# Блог globaltechtour.ru — ДЕЖУРНЫЙ РЕЖИМ (без cron-поллинга).
# Один прогон живёт ~5 ч 40 мин, раз в минуту проверяет очередь, публикует в 15:00 МСК
# и в конце запускает следующего себя через workflow_dispatch. Планировщик GitHub
# в цепочке не участвует. Ручной запуск без window — разовая публикация просроченного.
name: Блог из POST-HUB

on:
  workflow_dispatch:
    inputs:
      window:
        description: "Секунд дежурства (пусто — разовая публикация)"
        required: false
        default: ""
      post:
        description: "Одна статья сейчас: папка в GTT/BLOG/READY"
        required: false
        default: ""
      dry_run:
        description: "Только показать, что вышло бы"
        type: boolean
        default: false
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: blog-from-post-hub
  cancel-in-progress: false

env:
  EVENT: ${{ github.event_name }}
  INPUT_WINDOW: ${{ inputs.window }}
  INPUT_POST: ${{ inputs.post }}
  INPUT_DRY: ${{ inputs.dry_run }}
  BRANCH: claude/sinotech-voyage-setup
  PROJECT: GTT

jobs:
  duty:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.window != '') && 355 || 20 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/sinotech-voyage-setup
          path: site
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: Ostap-87/POST-HUB
          ref: main
          path: hub
          fetch-depth: 1
          sparse-checkout: |
            CONTROL
            GTT/BLOG/READY

      - name: Публикация
        id: pub
        run: |
          set -u
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          run_publish() {
            for attempt in 1 2 3 4; do
              git fetch -q --depth=1 origin "$BRANCH" || true
              git reset -q --hard "origin/$BRANCH" || true
              if [ "$INPUT_DRY" = "true" ]; then
                python3 ../hub/CONTROL/TOOLS/blog_site.py --project "$PROJECT" --site . --due --dry-run || true
                return 0
              fi
              if [ -n "$INPUT_POST" ]; then
                args="--project $PROJECT --site . --post $INPUT_POST"
              else
                args="--project $PROJECT --site . --due"
              fi
              python3 ../hub/CONTROL/TOOLS/blog_site.py $args > ../out.txt 2>&1 || true
              cat ../out.txt
              slugs=$(sed -n 's/^PUBLISHED_SLUG=//p' ../out.txt | tr '\n' ' ' | sed 's/ *$//')
              if [ -z "$slugs" ]; then return 0; fi
              python3 -c "import json; json.load(open('src/data/site_content.example.json'))" || return 1
              git add -A src/data/site_content.example.json public/covers
              git commit -q -m "Publish blog article: $slugs (POST-HUB)"
              if git push -q origin "HEAD:$BRANCH"; then
                echo "### Вышло: $slugs" >> "$GITHUB_STEP_SUMMARY"
                return 0
              fi
              sleep $((attempt * 10))
            done
            return 1
          }

          W="$INPUT_WINDOW"
          if [ -z "$W" ]; then W=0; fi
          if [ "$EVENT" = "schedule" ]; then W=20400; fi
          if [ "$W" -gt 0 ]; then
            echo "duty=1" >> "$GITHUB_OUTPUT"
            END=$(( $(date +%s) + W ))
            while [ "$(date +%s)" -lt "$END" ]; do
              git -C ../hub fetch -q --depth=1 origin main || true
              git -C ../hub reset -q --hard origin/main || true
              run_publish || echo "попытка не удалась, повтор"
              sleep 60
            done
          else
            run_publish
          fi

      - name: Передать смену следующему дежурному
        if: ${{ !cancelled() && steps.pub.outputs.duty == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run blog-from-post-hub.yml --repo "$GITHUB_REPOSITORY" --ref main -f window=20400
